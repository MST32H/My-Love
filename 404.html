<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0b0809" />
    <title>این صفحه گم شده؛ قصه ما نه</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(
            circle at 50% 20%,
            #61152b55,
            transparent 42%
          ),
          #080709;
        color: #f5e7d2;
        font-family: Tahoma, serif;
        padding: 24px;
      }
      .card {
        text-align: center;
        max-width: 700px;
        border: 1px solid #d2ae6d44;
        padding: 65px 35px;
        background: #ffffff05;
        box-shadow: 0 35px 100px #0008;
      }
      .num {
        font: 900 clamp(100px, 25vw, 220px) Georgia;
        color: #d2ae6d18;
        line-height: 0.7;
      }
      .mark {
        font: 14px Georgia;
        color: #d2ae6d;
        letter-spacing: 0.2em;
      }
      .card h1 {
        font:
          500 clamp(32px, 6vw, 62px) Georgia,
          Tahoma,
          serif;
        margin: 24px 0 14px;
      }
      .card p {
        color: #c9b7a0;
        line-height: 2;
      }
      .card a {
        display: inline-block;
        margin-top: 22px;
        padding: 14px 25px;
        border: 1px solid #d2ae6d;
        color: #f2d8a7;
        text-decoration: none;
        background: #6b1428;
      }
      .card a:hover {
        background: #d2ae6d;
        color: #1a0b0e;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="num">404</div>
      <div class="mark">M × B · LOST SCENE</div>
      <h1>این صفحه گم شده؛ قصه ما نه.</h1>
      <p>
        گاهی مسیر اشتباه می‌شود، اما آدمی که قرار است کنارت بماند، راه برگشت را
        بلد است.
      </p>
      <a href="./?v=14">بازگشت به داستان ما</a>
    </main>
  </body>
</html>
